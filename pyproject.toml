[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whygame-reboot"
version = "0.1.0.dev0"
description = "A typed graph-adversary loop for inspectable causal revision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "llm-client[codex] @ git+https://github.com/BrianMills2718/llm_client.git@c171d542658402f7de4d99a2d3f3bf085b7b3c00",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
whygame-reboot = "whygame_reboot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  # AES sat in an optional `governance` extra from the day it was first pinned.
  # Nothing named that extra -- not this repository's pre-commit hook, not a
  # Makefile, not CI -- so `uv sync` never installed it, and on 2026-09-06 the
  # live virtualenvs of all three repositories that pin AES contained no `aes`
  # package at all. A pin that nothing installs is not adoption; the controls
  # were unreachable here for the entire time this repository claimed to use
  # them. `dev` is the right home: `uv sync` installs it by default, so a
  # developer checkout gets the controls, while `pip install whygame-reboot`
  # still does not drag a governance system into a product install.
  "agentic-engineering-system @ git+https://github.com/BrianMills2718/agentic-engineering-system.git@089bc6a57baee6f4d949cc2abe0dfef22ad62b18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whygame_reboot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
