[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whygame-reboot"
version = "0.1.0.dev0"
description = "A typed graph-adversary loop for inspectable causal revision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "llm-client[codex] @ git+https://github.com/BrianMills2718/llm_client.git@c171d542658402f7de4d99a2d3f3bf085b7b3c00",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
governance = [
  "agentic-engineering-system @ git+https://github.com/BrianMills2718/agentic-engineering-system.git@ce866efd2855318570034a39343dace73f243352",
]

[project.scripts]
whygame-reboot = "whygame_reboot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whygame_reboot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
